x-common-variables: &common-variables
  POSTGRES_USER: myuser
  POSTGRES_PASSWORD: mypassword
  POSTGRES_DB: mydatabase

services:
  server:
    build:
      context: ./server
    container_name: server
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      <<: *common-variables
    links:
      - postgres:postgres
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:17-alpine3.22
    container_name: postgres
    restart: unless-stopped
    environment:
      <<: *common-variables
      POSTGRES_SHARED_BUFFERS: 32MB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 64MB
    ports:
      - 5432:5432
    volumes:
      - ./database-init.sql:/docker-entrypoint-initdb.d/database-init.sql
    mem_limit: 512m

  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - 9090
    ports:
      - 9090:9090
    links:
      - logporter:logporter

  grafana:
    image: grafana/grafana:latest
    container_name: monitoring_grafana
    restart: unless-stopped
    ports:
      - 3001:3000
    links:
      - prometheus:prometheus
    volumes:
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/main.json:ro
      - ./grafana/provisioning/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml:ro
      - ./grafana/provisioning/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  logporter:
    image: lifailon/logporter
    container_name: logporter
    restart: unless-stopped
    ports:
      - 9333:9333
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
