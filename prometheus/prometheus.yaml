global:
  scrape_interval:     30s
  evaluation_interval: 30s

  external_labels:
      monitor: 'my-project'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
         - targets: ['localhost:9090']

  - job_name: logporter
    scrape_interval: 5s
    scrape_timeout: 1s
    static_configs:
      - targets: ['logporter:9333']